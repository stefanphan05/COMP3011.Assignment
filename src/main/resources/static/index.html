<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Speech to Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-2xl mx-auto my-16 px-4 font-sans leading-relaxed">
<h1 class="text-3xl font-bold mb-6">Speech to Text</h1>

<button id="recordButton" class="px-6 py-3 rounded-lg bg-blue-600 text-white">
    Start recording
</button>

<p id="status" class="mt-4 text-gray-500">Ready</p>

<h2 class="text-xl font-semibold mt-8">Transcript</h2>
<div id="transcript" class="mt-4 p-4 min-h-[4rem] border border-gray-300 rounded-lg whitespace-pre-wrap"></div>

<script>
    const recordButton = document.getElementById("recordButton");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");

    let mediaRecorder = null;
    let chunks = [];

    recordButton.addEventListener("click", () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            stopRecording();
        } else {
            startRecording();
        }
    });

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio: true});

            chunks = [];
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.addEventListener("dataavailable", event => chunks.push(event.data));

            mediaRecorder.addEventListener("stop", () => {
                stream.getTracks().forEach(track => track.stop());
                sendForTranscription();
            });

            mediaRecorder.start();
            recordButton.textContent = "Stop recording";
            recordButton.classList.replace("bg-blue-600", "bg-red-600");
            status.textContent = "Recording — speak now";
            transcript.textContent = "";
        } catch (error) {
            status.textContent = "Could not access the microphone: " + error.message;
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        recordButton.textContent = "Start recording";
        recordButton.classList.replace("bg-red-600", "bg-blue-600");
        status.textContent = "Transcribing...";
    }

    async function sendForTranscription() {
        const mimeType = mediaRecorder.mimeType || "audio/webm";
        const extension = mimeType.includes("mp4") ? "m4a" : "webm";
        const audio = new Blob(chunks, {type: mimeType});
        const form = new FormData();
        form.append("file", audio, "recording." + extension);

        try {
            const response = await fetch("/api/v1/transcribe", {method: "POST", body: form});
            if (!response.ok) {
                throw new Error("Server returned " + response.status);
            }
            const result = await response.json();
            transcript.textContent = result.text;
            status.textContent = "Ready";
        } catch (error) {
            status.textContent = "Transcription failed: " + error.message;
        }
    }
</script>
</body>
</html>
