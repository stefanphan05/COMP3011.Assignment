<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Speech to Text</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Speech to Text</h1>

    <!-- Shown only if the browser cannot record at all, in which case the
    button is hidden: never offer a control that cannot work. -->
    <p id="unsupported" class="error" role="alert" hidden></p>

    <button id="record" type="button" aria-pressed="false">
        <span class="dot" aria-hidden="true"></span>
        <span id="record-label">Start recording</span>
    </button>

    <!-- Polite: announces what the app is doing without interrupting. -->
    <p id="status" class="status" role="status" aria-live="polite">Ready</p>

    <!-- Assertive and separate: errors interrupt, status updates do not. -->
    <p id="error" class="error" role="alert" hidden></p>

    <h2>Transcript</h2>
    <div id="transcript" class="transcript" tabindex="-1" aria-busy="false"></div>
    <p id="savings" class="muted" hidden></p>

    <h2>Server</h2>
    <p id="stats" class="muted">&mdash;</p>
</main>

<script src="app.js"></script>
</body>
</html>
