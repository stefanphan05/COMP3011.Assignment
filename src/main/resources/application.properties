spring.application.name=assignment
server.shutdown=graceful

spring.threads.virtual.enabled=true

openai.api.key=${OPENAI_API_KEY:}
openai.api.base-url=https://api.openai.com
openai.model=gpt-4o-mini-transcribe

# How long the graceful-shutdown thread waits before closing the context,
# the 202 response has time to reach the client first
app.shutdown.delay=500ms

# How long Spring lets in-flight requests finish before forcing the shutdown
spring.lifecycle.timeout-per-shutdown-phase=20s

# 25MB matches the maximum OpenAI accepts for audio transcription, so anything
# larger is rejected here rather than being uploaded only to fail upstream.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
